<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MQTT 网页聊天室</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif; 
      background: linear-gradient(135deg, #e2e8f0 0%, #d5e0ea 100%); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      color: #1d1d1f;
    }

    .chat-card { 
      width: 95%; 
      max-width: 850px; 
      height: 85vh; 
      background: rgba(255, 255, 255, 0.75); 
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 18px; 
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.12),
        0 0 0 1px rgba(255, 255, 255, 0.6) inset,
        0 0 0 1px rgba(0, 0, 0, 0.08); 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
    }
    
    .header { 
      padding: 14px 18px; 
      background: rgba(246, 246, 246, 0.6); 
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08); 
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h2 { font-size: 14px; font-weight: 600; color: #333; }

    .status-box { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #8e8e93; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #ff3b30; display: inline-block; flex-shrink: 0; }
    .status-dot.online { background: #34c759; } 
    
    .main-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(0, 0, 0, 0.06);
    }

    .chat-body { 
      flex: 1; 
      padding: 18px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      background: rgba(245, 245, 247, 0.4); 
    }

    .msg-item { display: flex; flex-direction: column; max-width: 78%; }
    .msg-item.me { align-self: flex-end; align-items: flex-end; }
    .msg-item.other { align-self: flex-start; align-items: flex-start; }

    .msg-meta { 
      display: flex; 
      align-items: baseline; 
      gap: 8px; 
      font-size: 11px; 
      color: #8e8e93; 
      margin-bottom: 3px; 
      padding: 0 2px; 
    }
    .msg-meta span { line-height: 1; }
    .msg-item.me .msg-meta { flex-direction: row-reverse; }

    .msg-bubble { 
      padding: 8px 12px; 
      border-radius: 14px; 
      font-size: 13px; 
      line-height: 1.45; 
      word-break: break-all; 
      white-space: pre-wrap; 
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    .msg-item.other .msg-bubble { 
      background: #ffffff; 
      color: #1d1d1f; 
      border: 1px solid rgba(0, 0, 0, 0.06); 
      border-top-left-radius: 4px; 
    }
    .msg-item.me .msg-bubble { 
      background: #007aff; 
      color: #ffffff; 
      border-top-right-radius: 4px; 
    }

    .user-sidebar {
      width: 200px;
      background: rgba(250, 250, 252, 0.5);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 10px 12px;
      font-size: 11px;
      font-weight: 700;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .user-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .user-item {
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
      color: #333;
      transition: background 0.2s, opacity 0.2s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-item:hover { background: rgba(0, 0, 0, 0.04); }
    .user-item.online { color: #2c3e50; font-weight: 500; }
    .user-item.me { font-weight: 600; color: #007aff; }

    .footer { 
      padding: 14px 18px; 
      border-top: 1px solid rgba(0, 0, 0, 0.06); 
      display: flex; 
      gap: 14px; /* 稍微拉开一点输入框与按钮的间距，更舒展 */
      background: rgba(255, 255, 255, 0.5); 
      backdrop-filter: blur(15px);
      align-items: flex-end; /* 底部对齐 */
    }
    
    textarea {
      flex: 1;
      height: 36px;
      max-height: 120px;
      padding: 6px 4px 4px 4px; /* 调整内边距：底部留 4px，让文字与下划线保持舒适距离 */
      margin-bottom: 2px; /* 微调 2px，确保下划线与右侧按钮底部完美平齐 */
      border: none;
      border-bottom: 1.5px solid rgba(0, 0, 0, 0.18); /* 默认下划线 */
      border-radius: 0;
      outline: none;
      resize: none;
      font-family: inherit;
      font-size: 13px;
      line-height: 22px;
      overflow-y: hidden;
      background: transparent;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    /* 优化 Placeholder 提示文字颜色 */
    textarea::placeholder {
      color: #a1a1a6;
      font-size: 13px;
    }

    textarea:focus { 
      background: transparent; 
      border-bottom-color: #007aff; /* 聚焦高亮蓝 */
      box-shadow: 0 1px 0 0 #007aff; 
    }
    
    button { 
      height: 36px; /* 调整为与单行 textarea 相同的等高 */
      padding: 0 20px; 
      background: #007aff; 
      color: white; 
      border: none; 
      border-radius: 10px; 
      cursor: pointer; 
      font-weight: 500; 
      font-size: 13px;
      flex-shrink: 0; 
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0, 122, 255, 0.2);
    }
    button:hover { background: #0062cc; }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>

<div class="chat-card">
  <div class="header">
    <h2>💬 #my_web_chat_room_2026</h2>
    <div class="status-box">
      <span id="statusDot" class="status-dot"></span>
      <span id="statusText">正在连接...</span>
    </div>
  </div>
  
  <div class="main-body">
    <div class="chat-area">
      <div class="chat-body" id="chatList"></div>
      
      <div class="footer">
        <textarea id="msgInput" placeholder="输入消息..."></textarea>
        <button onclick="sendMsg()">发送</button>
      </div>
    </div>

    <div class="user-sidebar">
      <div class="sidebar-header" id="userCountHeader">USERS (0)</div>
      <div class="user-list" id="userList"></div>
    </div>
  </div>
</div>

<script>
  // 1. 基础主题定义
  const BROKER_URL = 'wss://broker.emqx.io:8084/mqtt';
  const ROOM_ID = 'my_web_chat_room_2026';
  
  // 主消息 Topic 与 用户在线状态 Topic 隔离
  const CHAT_TOPIC = `chat/${ROOM_ID}/messages`;
  const USER_PRESENCE_PREFIX = `chat/${ROOM_ID}/users/`;
  const USER_PRESENCE_WILDCARD = `chat/${ROOM_ID}/users/+`;

  const myNickname = '用户_' + Math.floor(1000 + Math.random() * 9000);
  const myClientId = 'web_client_' + Math.random().toString(16).substring(2, 10);
  const myUserTopic = `${USER_PRESENCE_PREFIX}${myClientId}`;

  // 本地维护在线用户数据 Map: clientId -> { nickname: string }
  const onlineUsers = new Map();

  // DOM 节点
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const chatListEl = document.getElementById('chatList');
  const msgInput = document.getElementById('msgInput');
  const userListEl = document.getElementById('userList');
  const userCountHeader = document.getElementById('userCountHeader');

  // 输入框自适应高度
  msgInput.addEventListener('input', function() {
    this.style.height = '38px';
    const contentHeight = this.scrollHeight + 2;
    if (contentHeight > 120) {
      this.style.height = '120px';
      this.style.overflowY = 'auto';
    } else {
      this.style.height = Math.max(38, contentHeight) + 'px';
      this.style.overflowY = 'hidden';
    }
  });

  // 2. 连接 MQTT Broker (设置 Will 遗嘱消息)
  const client = mqtt.connect(BROKER_URL, {
    clientId: myClientId,
    clean: true,
    connectTimeout: 5000,
    will: {
      topic: myUserTopic,
      payload: '', // 空 Payload 在 MQTT 保留消息中意味着“清除此保留消息”
      qos: 1,
      retain: true // 遗嘱消息设为 retain: true，以便覆盖在线状态
    }
  });

  // 3. 监听 MQTT 连接成功
  client.on('connect', () => {
    statusText.innerText = '已连接';
    statusDot.classList.add('online');

    // 订阅聊天消息 Topic 和 用户状态变化 Topic
    client.subscribe([CHAT_TOPIC, USER_PRESENCE_WILDCARD], { qos: 1 });

    // 发布上线保留消息 (Retain: true)
    const userPresencePayload = JSON.stringify({ nickname: myNickname });
    client.publish(myUserTopic, userPresencePayload, { qos: 1, retain: true });
  });

  // 4. 监听接收消息
  client.on('message', (topic, payload) => {
    try {
      // 分流处理：如果是状态 Topic
      if (topic.startsWith(USER_PRESENCE_PREFIX)) {
        const senderClientId = topic.replace(USER_PRESENCE_PREFIX, '');
        const payloadStr = payload.toString();

        if (!payloadStr || payloadStr.trim() === '') {
          // Payload 为空 -> 表示该用户下线（清除 Retain 消息）
          onlineUsers.delete(senderClientId);
        } else {
          // Payload 不为空 -> 表示该用户在线
          const userData = JSON.parse(payloadStr);
          onlineUsers.set(senderClientId, { nickname: userData.nickname });
        }
        renderUserList();
        return;
      }

      // 分流处理：如果是聊天消息 Topic
      if (topic === CHAT_TOPIC) {
        const data = JSON.parse(payload.toString());
        const { senderId, nickname, text, time } = data;

        if (senderId !== myClientId) {
          addMessage(text, 'other', nickname, time);
        }
      }
    } catch (e) {
      console.error('消息解析失败:', e);
    }
  });

  client.on('error', (err) => {
    statusText.innerText = '连接失败: ' + err.message;
    statusDot.classList.remove('online');
  });

  // 页面关闭/刷新的优雅离开机制
  window.addEventListener('beforeunload', () => {
    if (client.connected) {
      // 主动发一条空的 Retain 消息清除自己的在线记录
      client.publish(myUserTopic, '', { qos: 1, retain: true });
    }
  });

  // 5. 发送聊天消息
  function sendMsg() {
    const text = msgInput.value.trim();
    if (!text) return;

    if (!client.connected) {
      alert('MQTT 尚未连接成功，请稍等！');
      return;
    }

    const now = Date.now();
    const payload = JSON.stringify({
      senderId: myClientId,
      nickname: myNickname,
      text: text,
      time: now
    });

    client.publish(CHAT_TOPIC, payload, { qos: 1 });

    addMessage(text, 'me', myNickname, now);

    msgInput.value = '';
    msgInput.style.height = '38px';
    msgInput.style.overflowY = 'hidden';
  }

  function formatTime(timestamp) {
    if (!timestamp) return '';
    const date = new Date(timestamp);
    return `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
  }

  function addMessage(text, type, sender, timestamp) {
    const itemDiv = document.createElement('div');
    itemDiv.className = `msg-item ${type}`;

    const metaDiv = document.createElement('div');
    metaDiv.className = 'msg-meta';
    
    const nameSpan = document.createElement('span');
    nameSpan.innerText = sender;
    
    const timeSpan = document.createElement('span');
    timeSpan.innerText = formatTime(timestamp);

    metaDiv.appendChild(nameSpan);
    metaDiv.appendChild(timeSpan);

    const bubbleDiv = document.createElement('div');
    bubbleDiv.className = 'msg-bubble';
    bubbleDiv.innerText = text;

    itemDiv.appendChild(metaDiv);
    itemDiv.appendChild(bubbleDiv);

    chatListEl.appendChild(itemDiv);
    chatListEl.scrollTop = chatListEl.scrollHeight;
  }

  // 6. 渲染用户列表
  function renderUserList() {
    userListEl.innerHTML = '';
    userCountHeader.innerText = `USERS (${onlineUsers.size})`;

    // 1. 先单独渲染“自己”
    if (onlineUsers.has(myClientId)) {
      const myUser = onlineUsers.get(myClientId);
      const myDiv = document.createElement('div');
      myDiv.className = 'user-item online me';
      myDiv.innerText = `${myUser.nickname} (我)`;
      userListEl.appendChild(myDiv);
    }

    // 2. 再遍历渲染其他所有用户
    onlineUsers.forEach((user, id) => {
      // 跳过自己，因为前面已经单独渲染过了
      if (id === myClientId) return;

      const userDiv = document.createElement('div');
      userDiv.className = 'user-item online';
      userDiv.innerText = user.nickname;
      userListEl.appendChild(userDiv);
    });
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MQTT 网页聊天室</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif; 
      background: linear-gradient(135deg, #e2e8f0 0%, #d5e0ea 100%); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      color: #1d1d1f;
    }

    .chat-card { 
      width: 95%; 
      max-width: 850px; 
      height: 85vh; 
      background: rgba(255, 255, 255, 0.75); 
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 18px; 
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.12),
        0 0 0 1px rgba(255, 255, 255, 0.6) inset,
        0 0 0 1px rgba(0, 0, 0, 0.08); 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
    }
    
    .header { 
      padding: 14px 18px; 
      background: rgba(246, 246, 246, 0.6); 
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08); 
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h2 { font-size: 14px; font-weight: 600; color: #333; }

    .status-box { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #8e8e93; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #ff3b30; display: inline-block; flex-shrink: 0; }
    .status-dot.online { background: #34c759; } 
    
    .main-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(0, 0, 0, 0.06);
    }

    .chat-body { 
      flex: 1; 
      padding: 18px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      background: rgba(245, 245, 247, 0.4); 
    }

    .msg-item { display: flex; flex-direction: column; max-width: 78%; }
    .msg-item.me { align-self: flex-end; align-items: flex-end; }
    .msg-item.other { align-self: flex-start; align-items: flex-start; }

    .msg-meta { 
      display: flex; 
      align-items: baseline; 
      gap: 8px; 
      font-size: 11px; 
      color: #8e8e93; 
      margin-bottom: 3px; 
      padding: 0 2px; 
    }
    .msg-meta span { line-height: 1; }
    .msg-item.me .msg-meta { flex-direction: row-reverse; }

    .msg-bubble { 
      padding: 8px 12px; 
      border-radius: 14px; 
      font-size: 13px; 
      word-break: break-all; 
      white-space: pre-wrap; 
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    .msg-item.other .msg-bubble { 
      background: #ffffff; 
      color: #1d1d1f; 
      border: 1px solid rgba(0, 0, 0, 0.06); 
      border-top-left-radius: 4px; 
    }
    .msg-item.me .msg-bubble { 
      background: #007aff; 
      color: #ffffff; 
      border-top-right-radius: 4px; 
    }

    /* 链接样式 */
    .msg-bubble a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .msg-item.other .msg-bubble a { color: #007aff; }
    .msg-item.me .msg-bubble a { color: #ffffff; }

    /* 文件消息：气泡内的文件内容 */
    .file-content {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none !important;
      cursor: pointer;
    }
    .file-content:hover { opacity: 0.85; }

    .file-icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .file-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .file-name { 
      font-weight: 600; 
      font-size: 12.5px; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
      max-width: 180px; 
    }
    .file-size-text { font-size: 11px; opacity: 0.65; }

    .user-sidebar {
      width: 200px;
      background: rgba(250, 250, 252, 0.5);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 10px 12px;
      font-size: 11px;
      font-weight: 700;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .user-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .user-item {
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
      color: #333;
      transition: background 0.2s, opacity 0.2s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-item:hover { background: rgba(0, 0, 0, 0.04); }
    .user-item.online { color: #2c3e50; font-weight: 500; }
    .user-item.me { font-weight: 600; color: #007aff; }

    .footer { 
      padding: 14px 18px; 
      border-top: 1px solid rgba(0, 0, 0, 0.06); 
      display: flex; 
      gap: 10px;
      background: rgba(255, 255, 255, 0.5); 
      backdrop-filter: blur(15px);
      align-items: flex-end;
    }
    
    textarea {
      flex: 1;
      height: 36px;
      max-height: 120px;
      padding: 6px 4px 4px 4px;
      margin-bottom: 2px;
      border: none;
      border-bottom: 1.5px solid rgba(0, 0, 0, 0.18);
      border-radius: 0;
      outline: none;
      resize: none;
      font-family: inherit;
      font-size: 13px;
      line-height: 22px;
      overflow-y: hidden;
      background: transparent;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    textarea::placeholder {
      color: #a1a1a6;
      font-size: 13px;
    }

    textarea:focus { 
      background: transparent; 
      border-bottom-color: #007aff;
      box-shadow: 0 1px 0 0 #007aff; 
    }
    
    button, .btn { 
      height: 36px; 
      padding: 0 16px; 
      background: #007aff; 
      color: white; 
      border: none; 
      border-radius: 10px; 
      cursor: pointer; 
      font-weight: 500; 
      font-size: 13px;
      flex-shrink: 0; 
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0, 122, 255, 0.2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    button:hover, .btn:hover { background: #0062cc; }
    button:active, .btn:active { transform: scale(0.97); }

    .btn-file.uploading {
      pointer-events: none;
      opacity: 0.55;
    }

    /* 上传进度提示 */
    .upload-toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: rgba(30,30,30,0.88);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 10px 22px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      z-index: 999;
      transition: transform 0.35s cubic-bezier(.4,.0,.2,1), opacity 0.35s;
      opacity: 0;
      pointer-events: none;
    }
    .upload-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* 隐藏的 file input */
    #fileInput { display: none; }
  </style>
</head>
<body>

<div class="upload-toast" id="uploadToast">📤 正在上传文件...</div>

<div class="chat-card">
  <div class="header">
    <h2>💬 #my_web_chat_room_2026</h2>
    <div class="status-box">
      <span id="statusDot" class="status-dot"></span>
      <span id="statusText">正在连接...</span>
    </div>
  </div>
  
  <div class="main-body">
    <div class="chat-area">
      <div class="chat-body" id="chatList"></div>
      
      <div class="footer">
        <textarea id="msgInput" placeholder="输入消息..."></textarea>
        <input type="file" id="fileInput" />
        <button id="fileBtn" onclick="document.getElementById('fileInput').click()">发送文件</button>
        <button onclick="sendMsg()">发送</button>
      </div>
    </div>

    <div class="user-sidebar">
      <div class="sidebar-header" id="userCountHeader">USERS (0)</div>
      <div class="user-list" id="userList"></div>
    </div>
  </div>
</div>

<script>
  // ========== 基础配置 ==========
  const BROKER_URL = 'wss://broker.emqx.io:8084/mqtt';
  const ROOM_ID = 'my_web_chat_room_2026';
  const CHAT_TOPIC = `chat/${ROOM_ID}/messages`;
  const USER_PRESENCE_PREFIX = `chat/${ROOM_ID}/users/`;
  const USER_PRESENCE_WILDCARD = `chat/${ROOM_ID}/users/+`;

  // ★★★ 你自己的 Worker 文件存储地址 ★★★
  const WORKER_BASE_URL = 'https://tempfile-storage.lovefree.de5.net';

  const myNickname = '用户_' + Math.floor(1000 + Math.random() * 9000);
  const myClientId = 'web_client_' + Math.random().toString(16).substring(2, 10);
  const myUserTopic = `${USER_PRESENCE_PREFIX}${myClientId}`;
  const onlineUsers = new Map();

  // DOM
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const chatListEl = document.getElementById('chatList');
  const msgInput = document.getElementById('msgInput');
  const userListEl = document.getElementById('userList');
  const userCountHeader = document.getElementById('userCountHeader');
  const fileInput = document.getElementById('fileInput');
  const fileBtn = document.getElementById('fileBtn');
  const uploadToast = document.getElementById('uploadToast');

  // ========== 输入框自适应 ==========
  msgInput.addEventListener('input', function() {
    this.style.height = '36px';
    const h = this.scrollHeight + 2;
    if (h > 120) {
      this.style.height = '120px';
      this.style.overflowY = 'auto';
    } else {
      this.style.height = Math.max(36, h) + 'px';
      this.style.overflowY = 'hidden';
    }
  });

  // Enter 发送, Shift+Enter 换行
  msgInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMsg();
    }
  });

  // ========== MQTT 连接 ==========
  const client = mqtt.connect(BROKER_URL, {
    clientId: myClientId,
    clean: true,
    connectTimeout: 5000,
    will: {
      topic: myUserTopic,
      payload: '',
      qos: 1,
      retain: true
    }
  });

  client.on('connect', () => {
    statusText.innerText = '已连接';
    statusDot.classList.add('online');
    client.subscribe([CHAT_TOPIC, USER_PRESENCE_WILDCARD], { qos: 1 });
    client.publish(myUserTopic, JSON.stringify({ nickname: myNickname }), { qos: 1, retain: true });
  });

  client.on('message', (topic, payload) => {
    try {
      if (topic.startsWith(USER_PRESENCE_PREFIX)) {
        const senderClientId = topic.replace(USER_PRESENCE_PREFIX, '');
        const payloadStr = payload.toString();
        if (!payloadStr || payloadStr.trim() === '') {
          onlineUsers.delete(senderClientId);
        } else {
          const userData = JSON.parse(payloadStr);
          onlineUsers.set(senderClientId, { nickname: userData.nickname });
        }
        renderUserList();
        return;
      }

      if (topic === CHAT_TOPIC) {
        const data = JSON.parse(payload.toString());
        if (data.senderId !== myClientId) {
          if (data.type === 'file') {
            addFileMessage(data, 'other');
          } else {
            addMessage(data.text, 'other', data.nickname, data.time);
          }
        }
      }
    } catch (e) {
      console.error('消息解析失败:', e);
    }
  });

  client.on('error', (err) => {
    statusText.innerText = '连接失败: ' + err.message;
    statusDot.classList.remove('online');
  });

  window.addEventListener('beforeunload', () => {
    if (client.connected) {
      client.publish(myUserTopic, '', { qos: 1, retain: true });
    }
  });

  // ========== 发送文字消息 ==========
  function sendMsg() {
    const text = msgInput.value.trim();
    if (!text) return;
    if (!client.connected) { alert('MQTT 尚未连接成功，请稍等！'); return; }

    const now = Date.now();
    const payload = JSON.stringify({
      senderId: myClientId,
      nickname: myNickname,
      type: 'text',
      text: text,
      time: now
    });

    client.publish(CHAT_TOPIC, payload, { qos: 1 });
    addMessage(text, 'me', myNickname, now);
    msgInput.value = '';
    msgInput.style.height = '36px';
    msgInput.style.overflowY = 'hidden';
  }

  // ========== 文件上传 (自己的 Worker 临时存储) ==========
  function uploadWithProgress(url, formData, onProgress) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', url);
      xhr.upload.addEventListener('progress', (e) => {
        if (e.lengthComputable) onProgress(e.loaded / e.total);
      });
      xhr.addEventListener('load', () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          resolve(xhr.responseText.trim());
        } else {
          reject(new Error('HTTP ' + xhr.status + ': ' + xhr.responseText));
        }
      });
      xhr.addEventListener('error', () => reject(new Error('网络错误，上传失败')));
      xhr.send(formData);
    });
  }

  fileInput.addEventListener('change', async function() {
    const file = this.files[0];
    if (!file) return;
    this.value = '';

    if (!client.connected) { alert('MQTT 尚未连接，请稍等！'); return; }

    const MAX_SIZE = 100 * 1024 * 1024; // 100MB，Worker KV 上限
    if (file.size > MAX_SIZE) {
      alert('文件大小超过 100 MB 限制，当前: ' + (file.size / 1024 / 1024).toFixed(1) + ' MB');
      return;
    }

    fileBtn.classList.add('uploading');
    fileBtn.textContent = '上传中 0%';
    

    try {
      const formData = new FormData();
      formData.append('file', file);  // 字段名 "file"，对应 Worker 端

      const responseText = await uploadWithProgress(
        WORKER_BASE_URL + '/upload',
        formData,
        (p) => {
          const pct = Math.round(p * 100);
          fileBtn.textContent = '上传中 ' + pct + '%';
          
        }
      );

      const result = JSON.parse(responseText);

      if (!result.success || !result.url) {
        throw new Error(result.error || '服务器返回异常');
      }

      const fileUrl = result.url; // 一次性下载直链

      const now = Date.now();
      const msgData = {
        senderId: myClientId,
        nickname: myNickname,
        type: 'file',
        fileName: file.name,
        fileSize: file.size,
        fileUrl: fileUrl,
        time: now
      };

      client.publish(CHAT_TOPIC, JSON.stringify(msgData), { qos: 1 });
      addFileMessage(msgData, 'me');

      showToast('✅ 上传完成！文件仅可下载一次');
      setTimeout(hideToast, 2500);

    } catch (err) {
      console.error('上传失败:', err);
      showToast('❌ 上传失败: ' + err.message);
      setTimeout(hideToast, 3000);
    } finally {
      fileBtn.classList.remove('uploading');
      fileBtn.textContent = '发送文件';
    }
  });

  // ========== Toast 提示 ==========
  function showToast(msg) {
    uploadToast.textContent = msg;
    uploadToast.classList.add('show');
  }
  function hideToast() {
    uploadToast.classList.remove('show');
  }

  // ========== 渲染消息 ==========
  function formatTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  function formatFileSize(bytes) {
    if (!bytes || bytes === 0) return '';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
  }

  function getFileIcon(fileName) {
    const ext = (fileName || '').split('.').pop().toLowerCase();
    const map = {
      pdf: '📕', doc: '📘', docx: '📘', xls: '📗', xlsx: '📗',
      ppt: '📙', pptx: '📙', zip: '🗜️', rar: '🗜️', '7z': '🗜️',
      jpg: '🖼️', jpeg: '🖼️', png: '🖼️', gif: '🖼️', webp: '🖼️', svg: '🖼️',
      mp4: '🎬', mov: '🎬', avi: '🎬', mkv: '🎬',
      mp3: '🎵', wav: '🎵', flac: '🎵',
      txt: '📄', md: '📄', json: '📄', csv: '📄',
      js: '💻', html: '💻', css: '💻', py: '💻',
      exe: '⚙️', dmg: '⚙️', apk: '📦',
    };
    return map[ext] || '📁';
  }

  // 普通文字消息
  function addMessage(text, type, sender, timestamp) {
    const itemDiv = document.createElement('div');
    itemDiv.className = `msg-item ${type}`;

    const metaDiv = document.createElement('div');
    metaDiv.className = 'msg-meta';
    const nameSpan = document.createElement('span');
    nameSpan.innerText = sender;
    const timeSpan = document.createElement('span');
    timeSpan.innerText = formatTime(timestamp);
    metaDiv.appendChild(nameSpan);
    metaDiv.appendChild(timeSpan);

    const bubbleDiv = document.createElement('div');
    bubbleDiv.className = 'msg-bubble';
    bubbleDiv.innerHTML = linkifyText(text);

    itemDiv.appendChild(metaDiv);
    itemDiv.appendChild(bubbleDiv);
    chatListEl.appendChild(itemDiv);
    chatListEl.scrollTop = chatListEl.scrollHeight;
  }

  // 文件消息（使用与文字相同的气泡）
  function addFileMessage(data, type) {
    const itemDiv = document.createElement('div');
    itemDiv.className = `msg-item ${type}`;

    const metaDiv = document.createElement('div');
    metaDiv.className = 'msg-meta';
    const nameSpan = document.createElement('span');
    nameSpan.innerText = data.nickname;
    const timeSpan = document.createElement('span');
    timeSpan.innerText = formatTime(data.time);
    metaDiv.appendChild(nameSpan);
    metaDiv.appendChild(timeSpan);

    const bubbleDiv = document.createElement('div');
    bubbleDiv.className = 'msg-bubble';

    const fileLink = document.createElement('a');
    fileLink.className = 'file-content';
    fileLink.href = data.fileUrl;
    fileLink.target = '_blank';
    fileLink.rel = 'noopener noreferrer';
    fileLink.setAttribute('download', data.fileName);
    fileLink.title = '点击下载: ' + data.fileName + '（一次性链接，下载后自动销毁）';

    fileLink.innerHTML = `
      <div class="file-icon">${getFileIcon(data.fileName)}</div>
      <div class="file-info">
        <div class="file-name">${escapeHtml(data.fileName)}</div>
        <div class="file-size-text">${formatFileSize(data.fileSize)}</div>
      </div>
    `;

    bubbleDiv.appendChild(fileLink);
    itemDiv.appendChild(metaDiv);
    itemDiv.appendChild(bubbleDiv);
    chatListEl.appendChild(itemDiv);
    chatListEl.scrollTop = chatListEl.scrollHeight;
  }

  // ========== 工具函数 ==========
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // 将纯文本中的 URL 变成可点击链接
  function linkifyText(text) {
    const escaped = escapeHtml(text);
    const urlRegex = /(https?:\/\/[^\s<]+)/g;
    return escaped.replace(urlRegex, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  }

  // ========== 用户列表 ==========
  function renderUserList() {
    userListEl.innerHTML = '';
    userCountHeader.innerText = `USERS (${onlineUsers.size})`;

    if (onlineUsers.has(myClientId)) {
      const myUser = onlineUsers.get(myClientId);
      const myDiv = document.createElement('div');
      myDiv.className = 'user-item online me';
      myDiv.innerText = `${myUser.nickname} (我)`;
      userListEl.appendChild(myDiv);
    }

    onlineUsers.forEach((user, id) => {
      if (id === myClientId) return;
      const userDiv = document.createElement('div');
      userDiv.className = 'user-item online';
      userDiv.innerText = user.nickname;
      userListEl.appendChild(userDiv);
    });
  }
</script>

</body>
</html>
